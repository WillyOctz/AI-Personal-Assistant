<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nebula</title>
    <link rel="stylesheet" href="/static/palette.css?v=1">
</head>
<body>
<main class="shell">
    <header class="bar">
        <div id="orb" class="orb" data-state="idle"></div>
        <div class="bar-title">
            <strong>Nebula</strong>
            <span id="status" class="status">Connecting…</span>
        </div>
        <a class="icon-link" href="/dev" title="Dev console">⚙</a>
    </header>

    <button id="today-toggle" class="summary" type="button" aria-expanded="false" aria-controls="today">
        <span id="today-summary">Loading…</span>
        <span class="chev">▾</span>
    </button>

    <section id="today" class="today" hidden>
        <div class="block">
            <h3>Focus</h3>
            <p id="focus-line" class="card-line">Not focusing.</p>
            <p id="goal-line" class="muted" hidden></p>
            <div id="goal-progress" class="progress" hidden><span id="goal-fill"></span></div>
            <div class="row">
                <button id="focus-start" class="btn primary" type="button">Start focus</button>
                <button id="focus-stop" class="btn danger" type="button" hidden>Stop</button>
            </div>
            <form id="note-form" class="mini-form" hidden>
                <input id="note-input" type="text" placeholder="Add a focus note" autocomplete="off" required>
                <button class="btn" type="submit">Note</button>
            </form>
        </div>

        <div class="block">
            <h3>Reminders</h3>
            <ul id="reminder-list" class="plain-list"></ul>
            <form id="reminder-form" class="mini-form">
                <input id="reminder-text" type="text" placeholder="Add a reminder" autocomplete="off" required>
                <input id="reminder-due" type="date" aria-label="Due date">
                <button class="btn" type="submit">Add</button>
            </form>
        </div>

        <div id="launch-block" class="block" hidden>
            <h3>Quick launch</h3>
            <div id="launch-chips" class="chips wrap"></div>
        </div>
    </section>

    <section id="messages" class="messages" aria-live="polite" aria-label="Conversation"></section>

    <div class="chips">
        <button class="chip" type="button" data-cmd="daily briefing">Briefing</button>
        <button class="chip" type="button" data-cmd="show reminders">Reminders</button>
        <button class="chip" type="button" data-cmd="start focus">Start focus</button>
        <button class="chip" type="button" data-cmd="focus dashboard">Focus stats</button>
    </div>

    <form id="chat-form" class="composer">
        <label class="sr-only" for="message-input">Message Nebula</label>
        <textarea id="message-input" rows="1" placeholder="Ask Nebula, or find something…" autocomplete="off"></textarea>
        <button id="send-button" class="send" type="submit">Send</button>
    </form>
</main>
<script src="/static/app.js?v=1"></script>
</body>
</html>
