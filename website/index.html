<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nebula</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main class="app-shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">Nebula</p>
                <h1>Personal Assistant</h1>
            </div>
            <span id="connection-status" class="status">Local API</span>
        </header>

        <div class="workspace">
            <section class="chat-panel">
                <section
                    id="messages"
                    class="messages"
                    aria-live="polite"
                    aria-label="Conversation"
                ></section>

                <div id="confirmation-actions" class="confirmation-actions" hidden>
                    <button id="confirm-button" type="button">Yes</button>
                    <button id="cancel-button" class="cancel-button" type="button">No</button>
                </div>

                <form id="chat-form" class="composer">
                    <label class="sr-only" for="message-input">Message Nebula</label>
                    <textarea
                        id="message-input"
                        name="message"
                        rows="1"
                        placeholder="Message Nebula"
                        autocomplete="off"
                        required
                    >
                    </textarea>
                    <button id="send-button" type="submit">Send</button>
                </form>
            </section>

            <aside class="reminder-panel" aria-label="Reminders">
                <section class="profile-panel" aria-label="Profile facts">
                    <div class="panel-heading">
                        <h2>Profile</h2>
                    </div>
                    <dl id="profile-fact-list" class="profile-fact-list"></dl>
                </section>

                <div class="panel-heading">
                    <h2>Reminders</h2>
                    <span id="reminder-count" class="reminder-count">0</span>
                </div>
                <form id="reminder-form" class="reminder-form">
                    <label class="sr-only" for="reminder-text-input">Reminder text</label>
                    <input
                        id="reminder-text-input"
                        class="reminder-text-input"
                        type="text"
                        placeholder="Add a reminder"
                        required
                    >

                    <label class="sr-only" for="reminder-due-input">Due date</label>
                    <input
                        id="reminder-due-input"
                        class="reminder-due-input"
                        type="date"
                    >

                    <button id="add-reminder-button" type="submit">Add</button>
                </form>
                 <ul id="reminder-list" class="reminder-list"></ul>

                <section class="apps-panel" aria-label="Registered apps">
                    <div class="panel-heading">
                        <h2>Registered Apps</h2>
                        <span id="app-count" class="app-count">0</span>
                    </div>
                    <ul id="app-list" class="app-list"></ul>
                </section>

                <section class="websites-panel" aria-label="Registered websites">
                    <div class="panel-heading">
                        <h2>Registered Websites</h2>
                        <span id="website-count" class="website-count">0</span>
                    </div>
                    <ul id="website-list" class="website-list"></ul>
                </section>
                
                <section class="active-focus-panel" aria-label="Active focus session">
                    <div class="panel-heading">
                        <h2>Active Focus</h2>
                        <span id="focus-status" class="focus-status">Idle</span>
                    </div>
                    <p id="focus-task" class="active-focus-task" hidden></p>
                    <p id="focus-note-count" class="active-focus-meta" hidden></p>
                    <div class="focus-actions">
                        <button id="start-focus-button" type="button">Start</button>
                        <button id="stop-focus-button" class="stop-focus-button" type="button">
                            Stop
                        </button>
                    </div>
                    <form id="focus-note-form" class="focus-note-form" hidden>
                        <label class="sr-only" for="focus-note-input">Focus note</label>
                        <input
                            id="focus-note-input"
                            type="text"
                            placeholder="Add a focus note"
                            required
                        >
                        <button id="add-focus-note-button" type="submit">Note</button>
                    </form>
                </section>

                <section class="focus-goal-panel" aria-label="Focus goal progress">
                    <div class="panel-heading">
                        <h2>Today's Goal</h2>
                    </div>

                    <p id="focus-goal-text" class="focus-goal-text"></p>

                    <div id="focus-progress-track" class="focus-progress-track" hidden>
                        <div
                            id="focus-progress-fill"
                            class="focus-progress-fill"
                            role="progressbar"
                            aria-valuemin="0"
                            aria-valuemax="100"
                        ></div>
                    </div>

                    <p id="focus-goal-meta" class="focus-goal-meta"></p>
                </section>

                <section class="focus-panel" aria-label="Recent focus sessions">
                    <div class="panel-heading">
                        <h2>Recent Focus</h2>
                    </div>
                    <ul id="focus-session-list" class="focus-session-list"></ul>
                </section>
            </aside>
        </div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
